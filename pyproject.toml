[project]
name = "chemkg"
version = "0.1.0"
description = "Chemists of Wikidata: a reproducible pipeline and explorer for the 'science of scientists'"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
  "pandas==2.2.3",
  "pyarrow==18.1.0",
  "polars==1.17.1",
  "numpy==2.1.3",
  "networkx==3.4.2",
  "lifelines==0.30.0",
  "scikit-learn==1.6.0",
  "SPARQLWrapper==2.0.0",
  "matplotlib==3.9.3",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "jupyter==1.1.1",
  "nbconvert==7.16.4",
  "nbformat==5.10.4",
  "ipykernel==6.29.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chemkg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
